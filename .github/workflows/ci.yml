name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Checks (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            sync-server
            crates/sync-proto
      - run: pnpm install --frozen-lockfile
      - name: All checks (pnpm check)
        run: pnpm check
      - name: Generated bindings are up to date
        run: git diff --exit-code -- src/bindings.ts

  windows:
    name: Checks (Windows)
    runs-on: windows-latest
    steps:
      # Keep LF line endings so Biome and the tests see the same bytes as on macOS.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            sync-server
            crates/sync-proto
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Core tests
        working-directory: src-tauri
        run: cargo test
      - name: Sync protocol tests
        working-directory: crates/sync-proto
        run: cargo test
      - name: Sync server tests
        working-directory: sync-server
        run: cargo test
