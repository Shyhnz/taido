name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Checks (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri
            sync-server
            crates/sync-proto
      - run: pnpm install --frozen-lockfile
      - name: All checks (pnpm check)
        run: pnpm check
      - name: Generated bindings are up to date
        run: git diff --exit-code -- src/bindings.ts

  windows:
    name: Checks (Windows)
    runs-on: windows-latest
    steps:
      # Keep LF line endings so Biome and the tests see the same bytes as on macOS.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            src-tauri
            sync-server
            crates/sync-proto
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: DIAG codex exit loop
        working-directory: src-tauri
        shell: bash
        continue-on-error: true
        run: |
          cargo test --lib --no-run
          for n in 1 2 3 4 5 6 7 8; do
            powershell -NoProfile -Command 'while ($true) { $x = 1 }' &
          done
          sleep 2
          for i in $(seq 1 25); do
            echo "=== loaded round $i"
            cargo test --lib a_codex_session_without_message_cannot_be_resumed -- --nocapture 2>&1 | grep -aE "DIAG|panicked|test result" || true
          done
          for i in $(seq 1 2); do
            echo "=== full round $i"
            cargo test --lib -- --nocapture 2>&1 | grep -aE "DIAG|panicked|test result: .* [0-9]{3} passed" || true
          done
          taskkill //F //IM powershell.exe || true
      - name: Core tests
        working-directory: src-tauri
        run: cargo test
      - name: Sync protocol tests
        working-directory: crates/sync-proto
        run: cargo test
      - name: Sync server tests
        working-directory: sync-server
        run: cargo test
