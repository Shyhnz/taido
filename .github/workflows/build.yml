name: Build installers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Installer (macOS, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build the universal .dmg
        run: pnpm tauri build --target universal-apple-darwin --bundles dmg
      - name: Name the installer
        id: name
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          echo "Found: $dmg"
          mkdir -p dist-installer
          cp "$dmg" "dist-installer/Taido_${version}_universal.dmg"
          echo "artifact=Taido_${version}_universal.dmg" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: dist-installer/*.dmg
          if-no-files-found: error

  windows:
    name: Installer (Windows, x64)
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Build the NSIS installer
        run: pnpm tauri build --bundles nsis
      - name: Check the installer name
        id: name
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          ls src-tauri/target/release/bundle/nsis/
          test -f "src-tauri/target/release/bundle/nsis/Taido_${version}_x64-setup.exe"
          echo "artifact=Taido_${version}_x64-setup.exe" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact }}
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
