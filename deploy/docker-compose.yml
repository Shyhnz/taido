# Taido sync server + phone web app, behind Caddy (automatic HTTPS).
# Run from this folder:  docker compose up -d --build
# Full guide: docs/SELF-HOSTING.md
name: taido

services:
  taido:
    build:
      context: ..
      dockerfile: sync-server/Dockerfile
    restart: unless-stopped
    # No "ports": the server speaks plain HTTP and is only reachable by Caddy,
    # on the private Docker network.
    volumes:
      - taido-data:/data
    # Your settings live in deploy/.env (copy .env.example). Do not edit this file:
    # that keeps "git pull" updates clean and your secrets out of tracked files.
    # An empty value means "not set" for the server.
    environment:
      TAIDO_PUBLIC_URL: ${TAIDO_PUBLIC_URL:-https://${TAIDO_DOMAIN:?set TAIDO_DOMAIN in deploy/.env}}
      TAIDO_SIGNUPS: ${TAIDO_SIGNUPS:-open}
      TAIDO_SMTP_HOST: ${TAIDO_SMTP_HOST:-}
      TAIDO_SMTP_PORT: ${TAIDO_SMTP_PORT:-}
      TAIDO_SMTP_USER: ${TAIDO_SMTP_USER:-}
      TAIDO_SMTP_PASSWORD: ${TAIDO_SMTP_PASSWORD:-}
      TAIDO_MAIL_FROM: ${TAIDO_MAIL_FROM:-}
      TAIDO_MAX_FILE_BYTES: ${TAIDO_MAX_FILE_BYTES:-}
      TAIDO_ACCOUNT_QUOTA_BYTES: ${TAIDO_ACCOUNT_QUOTA_BYTES:-}
      TAIDO_MIN_FREE_BYTES: ${TAIDO_MIN_FREE_BYTES:-}
      TAIDO_RECORDS_QUOTA_BYTES: ${TAIDO_RECORDS_QUOTA_BYTES:-}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - taido
    ports:
      - "80:80"
      - "443:443"
    environment:
      TAIDO_DOMAIN: ${TAIDO_DOMAIN:?set TAIDO_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  taido-data:
  caddy-data:
  caddy-config:
