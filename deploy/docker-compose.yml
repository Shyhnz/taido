# Taido sync server + phone web app, behind Caddy (automatic HTTPS).
# Run from this folder:  docker compose up -d --build
# Full guide: docs/SELF-HOSTING.md
name: taido

services:
  taido:
    build:
      context: ..
      dockerfile: sync-server/Dockerfile
    restart: unless-stopped
    # No "ports": the server speaks plain HTTP and is only reachable by Caddy,
    # on the private Docker network.
    volumes:
      - taido-data:/data
    environment:
      # The public address of your server. Used in e-mails (address confirmation).
      TAIDO_PUBLIC_URL: https://${TAIDO_DOMAIN:?set TAIDO_DOMAIN in deploy/.env}
      # "open": anyone who knows the address can create an account from the desktop app.
      # Set it to "closed" once your accounts exist, then run: docker compose up -d
      TAIDO_SIGNUPS: open
      # Optional e-mail (password reset by code, address confirmation). See the guide.
      # TAIDO_SMTP_HOST: smtp.example.com
      # TAIDO_SMTP_PORT: 465
      # TAIDO_SMTP_USER: noreply@example.com
      # TAIDO_SMTP_PASSWORD: change-me
      # TAIDO_MAIL_FROM: "Taido <noreply@example.com>"
      # Optional limits, in bytes. See the guide.
      # TAIDO_MAX_FILE_BYTES: 104857600
      # TAIDO_ACCOUNT_QUOTA_BYTES: 2147483648
      # TAIDO_MIN_FREE_BYTES: 2147483648
      # TAIDO_RECORDS_QUOTA_BYTES: 52428800

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - taido
    ports:
      - "80:80"
      - "443:443"
    environment:
      TAIDO_DOMAIN: ${TAIDO_DOMAIN:?set TAIDO_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  taido-data:
  caddy-data:
  caddy-config:
