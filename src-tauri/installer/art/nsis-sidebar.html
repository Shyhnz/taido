<!doctype html>
<!-- Left image of the Windows installer's welcome and finish pages (164 × 314, NSIS

<html lang="fr">

<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Geist";

    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 164px; height: 314px; overflow: hidden; }

    position: relative;

  }
  .rings {
    position: absolute; left: 50%; top: 112px; transform: translate(-50%, -50%);
  }
  .glyph {
    position: absolute; left: 50%; top: 112px; transform: translate(-50%, -50%);
    filter: drop-shadow(0 6px 10px rgba(5, 12, 40, 0.45));

  .name {
    position: absolute; left: 0; right: 0; top: 214px;

    font-size: 25px; font-weight: 680; letter-spacing: -0.02em;
  }
  .tagline {
    position: absolute; left: 14px; right: 14px; top: 248px;
    text-align: center;
    font-size: 10.5px; line-height: 1.4; font-weight: 450; color: rgba(225, 232, 252, 0.78);

</style>
</head>
